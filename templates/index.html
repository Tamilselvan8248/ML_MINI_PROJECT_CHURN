<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Churn Prediction</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="bg-shape shadow-glow shape-1"></div>
    <div class="bg-shape shadow-glow shape-2"></div>

    <div class="container d-flex justify-content-center align-items-center min-vh-100 position-relative z-1">
        <div class="col-md-7 col-lg-6">
            <div class="glass-card p-5 text-center fade-in-up">
                <div class="mb-4">
                    <i class="fa-solid fa-chart-line fa-3x gradient-text mb-3"></i>
                    <h1 class="fw-bold mb-2">ChurnGuard AI</h1>
                    <p class="text-muted">Upload your customer dataset to predict churn using advanced Machine Learning models.</p>
                </div>

                {% if error %}
                <div class="alert alert-danger fade show custom-alert" role="alert">
                    <i class="fa-solid fa-triangle-exclamation me-2"></i> {{ error }}
                </div>
                {% endif %}

                <form action="{{ url_for('upload') }}" method="post" enctype="multipart/form-data">
                    <div class="upload-area mb-4" id="uploadArea">
                        <i class="fa-solid fa-cloud-arrow-up fa-3x mb-3 text-primary-custom"></i>
                        <h5 class="mb-1">Drag & Drop CSV File</h5>
                        <p class="text-muted small mb-3">or click to browse from your device</p>
                        <input type="file" name="csvfile" id="csvfile" class="d-none" accept=".csv" required>
                        <button type="button" class="btn btn-outline-primary rounded-pill px-4" onclick="document.getElementById('csvfile').click()">Select File</button>
                    </div>
                    <div id="file-name-display" class="mb-3 fw-bold text-success d-none"></div>
                    <button type="submit" class="btn btn-primary-gradient w-100 py-3 rounded-pill fw-bold" id="analyzeBtn" disabled>
                        <span>Analyze Dataset</span>
                        <i class="fa-solid fa-arrow-right ms-2"></i>
                    </button>
                    <div class="spinner-border spinner-border-sm text-light ms-2 d-none" id="loadingSpinner" role="status"></div>
                </form>

                <div class="mt-4 pt-3 border-top border-light-subtle text-muted small">
                    <p class="mb-0">Powered by <strong>KNN, Logistic Regression, Decision Tree & Random Forest</strong></p>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script>
        const fileInput = document.getElementById('csvfile');
        const fileNameDisplay = document.getElementById('file-name-display');
        const analyzeBtn = document.getElementById('analyzeBtn');
        const form = document.querySelector('form');
        const spinner = document.getElementById('loadingSpinner');

        fileInput.addEventListener('change', function() {
            if (this.files && this.files.length > 0) {
                const fileName = this.files[0].name;
                fileNameDisplay.innerHTML = `<i class="fa-solid fa-file-csv me-2"></i>${fileName}`;
                fileNameDisplay.classList.remove('d-none');
                analyzeBtn.removeAttribute('disabled');
            } else {
                fileNameDisplay.classList.add('d-none');
                analyzeBtn.setAttribute('disabled', 'true');
            }
        });

        form.addEventListener('submit', function() {
            analyzeBtn.querySelector('span').textContent = 'Analyzing Models...';
            spinner.classList.remove('d-none');
            analyzeBtn.classList.add('opacity-75');
            analyzeBtn.querySelector('.fa-arrow-right').classList.add('d-none');
            analyzeBtn.setAttribute('disabled', 'true');
            
            // Allow form to submit actually
            setTimeout(() => { analyzeBtn.removeAttribute('disabled'); }, 10);
        });
    </script>
</body>
</html>
